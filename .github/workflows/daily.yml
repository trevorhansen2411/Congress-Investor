name: Daily Conviction-Cluster Monitor

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Run the monitor
        env:
          QUIVER_TOKEN: ${{ secrets.QUIVER_TOKEN }}
        run: python monitor_ci.py

      - name: Publish the updated alert page
        run: |
          git config user.name  "cluster-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html docs/current_alerts.json
          git commit -m "Daily cluster refresh $(date -u +%Y-%m-%d)" || echo "No changes today"
          git push
